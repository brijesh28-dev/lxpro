<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #FFB703; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    svg { width: 1000px; height: 450px; }
    .controls { margin-top: 15px; display: flex; gap: 10px; }
    button { padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 20px; border: none; background: #111; color: #fff; }
  </style>
</head>
<body>
<svg id="road-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450">
  <defs>
    <!-- Road shadow -->
    <filter id="road-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlight-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#FEF08A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </linearGradient>

    <!-- Taillight Glow Gradient -->
    <radialGradient id="taillight-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <!-- Sedan Car Shadow -->
    <filter id="car-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Road White Border & Shadow -->
  <path
    id="road-border"
    d="M -30,240
       C 35,240 65,290 110,290
       C 165,290 205,155 270,155
       C 335,155 375,250 440,250
       C 515,250 555,85 645,85
       C 735,85 770,150 765,220
       C 760,285 700,295 640,295
       C 585,295 580,355 640,360
       C 720,365 770,335 840,330
       C 900,325 960,320 1030,315"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#road-shadow)"
  />

  <!-- Road Dark Asphalt -->
  <path
    id="road-path"
    d="M -30,240
       C 35,240 65,290 110,290
       C 165,290 205,155 270,155
       C 335,155 375,250 440,250
       C 515,250 555,85 645,85
       C 735,85 770,150 765,220
       C 760,285 700,295 640,295
       C 585,295 580,355 640,360
       C 720,365 770,335 840,330
       C 900,325 960,320 1030,315"
    fill="none"
    stroke="#22252E"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Road Center Dashed Line -->
  <path
    d="M -30,240
       C 35,240 65,290 110,290
       C 165,290 205,155 270,155
       C 335,155 375,250 440,250
       C 515,250 555,85 645,85
       C 735,85 770,150 765,220
       C 760,285 700,295 640,295
       C 585,295 580,355 640,360
       C 720,365 770,335 840,330
       C 900,325 960,320 1030,315"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-dasharray="14 14"
    stroke-linecap="round"
  />

  <!-- ── LUXURY SEDAN CAR (TOP VIEW) ── -->
  <!-- Origin at center of car: length ~44px, width ~20px -->
  <g id="sedan-car" transform="translate(110, 290)">
    <!-- 1. HEADLIGHT BEAMS (Forward Lighting on Asphalt) -->
    <!-- Left beam -->
    <polygon points="20,-6 65,-18 65,-2 20,-4" fill="url(#headlight-beam)" opacity="0.85" />
    <!-- Right beam -->
    <polygon points="20,6 65,18 65,2 20,4" fill="url(#headlight-beam)" opacity="0.85" />

    <!-- 2. TAILLIGHT RED GLOW (Behind car) -->
    <circle cx="-24" cy="-5" r="9" fill="url(#taillight-glow)" />
    <circle cx="-24" cy="5" r="9" fill="url(#taillight-glow)" />

    <!-- 3. CAR BODY GROUP with shadow -->
    <g filter="url(#car-shadow)">
      <!-- Main Aerodynamic Body Silhouette (Metallic Sapphire Blue) -->
      <!-- Nose at (+22, 0), Tail at (-22, 0) -->
      <path
        d="M 21,0
           C 21,-5 17,-9 10,-9.5
           L -14,-9.5
           C -19,-9.5 -21,-6 -21,0
           C -21,6 -19,9.5 -14,9.5
           L 10,9.5
           C 17,9.5 21,5 21,0 Z"
        fill="#1E3A8A"
        stroke="#60A5FA"
        stroke-width="0.8"
      />

      <!-- Body Metallic Highlights (Left & Right Shoulder Creases) -->
      <path d="M 12,-8.5 L -14,-8.5" stroke="#93C5FD" stroke-width="0.8" opacity="0.7" />
      <path d="M 12,8.5 L -14,8.5" stroke="#1D4ED8" stroke-width="0.8" opacity="0.7" />

      <!-- Side Mirrors -->
      <path d="M 8,-9.5 L 6,-12.5 L 10,-11.5 Z" fill="#1E3A8A" stroke="#93C5FD" stroke-width="0.5" />
      <path d="M 8,9.5 L 6,12.5 L 10,11.5 Z" fill="#1E3A8A" stroke="#93C5FD" stroke-width="0.5" />

      <!-- Front Windshield (Curved Dark Tint) -->
      <path
        d="M 10,-7.5
           C 11,-4 11,4 10,7.5
           L 4,6.5
           C 5,3 5,-3 4,-6.5 Z"
        fill="#0F172A"
        stroke="#38BDF8"
        stroke-width="0.5"
      />

      <!-- Glass Gloss Reflection Stripe -->
      <line x1="6" y1="-5" x2="8" y2="4" stroke="#BAE6FD" stroke-width="0.8" opacity="0.75" />

      <!-- Roof Panel -->
      <path
        d="M 4,-6.5
           L -8,-6.5
           C -9,-6.5 -10,-4 -10,0
           C -10,4 -9,6.5 -8,6.5
           L 4,6.5
           C 4.5,3 4.5,-3 4,-6.5 Z"
        fill="#172554"
      />

      <!-- Panoramic Sunroof Glass -->
      <rect x="-6" y="-4" width="8" height="8" rx="1.5" fill="#020617" stroke="#38BDF8" stroke-width="0.5" opacity="0.85" />

      <!-- Rear Windshield (Dark Tint) -->
      <path
        d="M -10,-6.5
           C -11,-3 -11,3 -10,6.5
           L -14,5.5
           C -14.5,2 -14.5,-2 -14,-5.5 Z"
        fill="#0F172A"
        stroke="#38BDF8"
        stroke-width="0.5"
      />

      <!-- Front Headlight Lamps (Bright Ice Blue / White LEDs) -->
      <ellipse cx="19" cy="-6" rx="2" ry="1.2" fill="#FFFFFF" stroke="#38BDF8" stroke-width="0.5" />
      <ellipse cx="19" cy="6" rx="2" ry="1.2" fill="#FFFFFF" stroke="#38BDF8" stroke-width="0.5" />

      <!-- Rear Taillights (Glowing Red LEDs) -->
      <rect x="-21" y="-8.5" width="2" height="4" rx="0.8" fill="#EF4444" />
      <rect x="-21" y="4.5" width="2" height="4" rx="0.8" fill="#EF4444" />
      <!-- High-mount brake light -->
      <line x1="-15" y1="-2" x2="-15" y2="2" stroke="#EF4444" stroke-width="1" />
    </g>
  </g>
</svg>

<div class="controls">
  <button onclick="goTo(0)">Milestone 1</button>
  <button onclick="goTo(1)">Milestone 2</button>
  <button onclick="goTo(2)">Milestone 3</button>
  <button onclick="goTo(3)">Milestone 4</button>
  <button onclick="goTo(4)">Milestone 5</button>
</div>

<script>
  const roadPath = document.getElementById('road-path');
  const sedanCar = document.getElementById('sedan-car');
  const totalLength = roadPath.getTotalLength();

  // Milestone targets along the path
  const targets = [0.11, 0.26, 0.43, 0.65, 0.90].map(pct => pct * totalLength);
  let currentDist = targets[0];
  let animId = null;

  function updateCar(dist) {
    const p1 = roadPath.getPointAtLength(Math.max(0, dist - 2));
    const p2 = roadPath.getPointAtLength(Math.min(totalLength, dist + 2));
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);
    sedanCar.setAttribute('transform', `translate(${p2.x}, ${p2.y}) rotate(${angle})`);
  }

  function goTo(idx) {
    cancelAnimationFrame(animId);
    const target = targets[idx];
    const start = currentDist;
    const startTime = performance.now();
    const duration = 1200;

    function animate(time) {
      const elapsed = time - startTime;
      const progress = Math.min(1, elapsed / duration);
      // Ease in-out
      const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      currentDist = start + (target - start) * ease;
      updateCar(currentDist);
      if (progress < 1) {
        animId = requestAnimationFrame(animate);
      }
    }
    animId = requestAnimationFrame(animate);
  }

  updateCar(currentDist);
</script>
</body>
</html>
